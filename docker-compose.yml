services:
  postgres:
    image: postgres:16-alpine
    container_name: pe-na-areia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no .env da VPS}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env da VPS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env da VPS}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/pabloleonardo93-png/sistema-quadras-backend:latest
    container_name: pe-na-areia-backend
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Configure POSTGRES_DB no .env da VPS}
      DB_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env da VPS}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env da VPS}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env da VPS}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-Administrador Local}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:?Configure ADMIN_SEED_EMAIL no .env da VPS}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?Configure ADMIN_SEED_PASSWORD no .env da VPS}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-5242880}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:8080}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:-}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:-}
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"

  frontend:
    image: ghcr.io/pabloleonardo93-png/sistema-quadras:latest
    container_name: pe-na-areia-frontend
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
    depends_on:
      - backend
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:8080}:80"

volumes:
  postgres_data:
  backend_uploads:
