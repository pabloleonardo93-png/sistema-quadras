name: build-and-push

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e publica frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/pabloleonardo93-png/sistema-quadras:latest
          build-args: |
            VITE_API_URL=/api

      - name: Build e publica backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ghcr.io/pabloleonardo93-png/sistema-quadras-backend:latest
