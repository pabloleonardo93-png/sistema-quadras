<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Reserve sua quadra de areia no Pé na Areia para beach tennis, futevôlei e vôlei de areia."
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/images/logo/logo-pe-na-areia-favicon-blue.png?v=20260718-3"
    />
    <link
      rel="shortcut icon"
      type="image/png"
      href="/images/logo/logo-pe-na-areia-favicon-blue.png?v=20260718-3"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/images/logo/logo-pe-na-areia-favicon-blue.png?v=20260718-3"
    />
    <meta name="theme-color" content="#192b88" />
    <link
      rel="preload"
      as="image"
      href="/images/logo/logo-pe-na-areia-header-white.png"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="image"
      href="/images/hero-beach-tennis-raquete.png"
      fetchpriority="high"
    />
    <title>Pé na Areia | Sua próxima partida começa aqui</title>
    <style>
      html,
      body {
        background: #0f1320;
      }

      html {
        min-height: 100%;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
      }

      #root {
        min-height: 100vh;
        min-height: 100dvh;
        background: #0f1320;
      }

      #root:empty::before {
        position: fixed;
        z-index: 100;
        inset: 0;
        background: #0f1320;
        content: "";
      }

      .boot-intro {
        position: fixed;
        z-index: 100;
        inset: 0;
        display: grid;
        place-items: center;
        overflow: hidden;
        background: #0f1320;
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          env(safe-area-inset-bottom) env(safe-area-inset-left);
      }

      .boot-intro img {
        width: clamp(180px, 18vw, 260px);
        height: auto;
        max-width: calc(100vw - 48px);
        aspect-ratio: 1120 / 260;
        object-fit: contain;
        opacity: 1;
        transform: none;
      }
    </style>
  </head>
  <body class="boot-intro-active">
    <div class="boot-intro" id="initial-boot-intro" aria-hidden="true">
      <img
        src="/images/logo/logo-pe-na-areia-header-white.png"
        alt=""
        width="1120"
        height="260"
        loading="eager"
        decoding="sync"
        fetchpriority="high"
      />
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
