server {
    listen 80;
    server_name team2.class-devops-ifrs-lucca.dedyn.io;
    return 301 https://$host$request_uri;   # força HTTPS
}

server {
    listen 443 ssl;
    server_name team2.class-devops-ifrs-lucca.dedyn.io;

    ssl_certificate     /etc/letsencrypt/live/team2.class-devops-ifrs-lucca.dedyn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/team2.class-devops-ifrs-lucca.dedyn.io/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}