# Exemplo para o nginx da VPS do laboratorio.
# Este arquivo nao e copiado para a imagem Docker.
# O backend continua interno na rede Docker. O dominio aponta para o
# frontend em 127.0.0.1:8080, e o Nginx do container encaminha /api e
# /uploads para o container backend:3000.

server {
    listen 80;
    server_name teamN.class-devops-ifrs-lucca.dedyn.io;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name teamN.class-devops-ifrs-lucca.dedyn.io;

    ssl_certificate /etc/letsencrypt/live/teamN.class-devops-ifrs-lucca.dedyn.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/teamN.class-devops-ifrs-lucca.dedyn.io/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
