services:
  postgres:
    image: postgres:18.4-alpine
    container_name: pe-na-areia-postgres
    restart: unless-stopped
    labels:
      wud.watch: "false"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB no .env da VPS}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env da VPS}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env da VPS}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    image: ghcr.io/pabloleonardo93-png/sistema-quadras-backend:latest
    container_name: pe-na-areia-backend
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:?Configure CORS_ORIGIN no .env da VPS}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:?Configure POSTGRES_DB no .env da VPS}
      DB_USER: ${POSTGRES_USER:?Configure POSTGRES_USER no .env da VPS}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env da VPS}
      JWT_SECRET: ${JWT_SECRET:?Configure JWT_SECRET no .env da VPS}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      ADMIN_SEED_NAME: ${ADMIN_SEED_NAME:-Administrador Local}
      ADMIN_SEED_EMAIL: ${ADMIN_SEED_EMAIL:?Configure ADMIN_SEED_EMAIL no .env da VPS}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:?Configure ADMIN_SEED_PASSWORD no .env da VPS}
      UPLOAD_DIR: ${UPLOAD_DIR:-uploads}
      UPLOAD_MAX_SIZE: ${UPLOAD_MAX_SIZE:-5242880}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:?Configure APP_PUBLIC_URL no .env da VPS}
      API_PUBLIC_URL: ${API_PUBLIC_URL:?Configure API_PUBLIC_URL no .env da VPS}
      MERCADO_PAGO_ACCESS_TOKEN: ${MERCADO_PAGO_ACCESS_TOKEN:?Configure MERCADO_PAGO_ACCESS_TOKEN no .env da VPS}
      MERCADO_PAGO_WEBHOOK_URL: ${MERCADO_PAGO_WEBHOOK_URL:-}
      MERCADO_PAGO_WEBHOOK_SECRET: ${MERCADO_PAGO_WEBHOOK_SECRET:?Configure MERCADO_PAGO_WEBHOOK_SECRET no .env da VPS}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      RESEND_TEMPLATE_VERIFICACAO_ID: ${RESEND_TEMPLATE_VERIFICACAO_ID:-}
      CODIGO_VERIFICACAO_EXPIRACAO_MINUTOS: ${CODIGO_VERIFICACAO_EXPIRACAO_MINUTOS:-}
      EMAIL_VERIFICATION_PROVIDER: ${EMAIL_VERIFICATION_PROVIDER:-}
      EMAIL_VERIFICATION_JWT_SECRET: ${EMAIL_VERIFICATION_JWT_SECRET:-}
    expose:
      - "3000"
    volumes:
      - backend_uploads:/app/uploads
    command: sh -c "npm run db:migrate && npm run db:seed && npm start"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: ghcr.io/pabloleonardo93-png/sistema-quadras:latest
    container_name: pe-na-areia-frontend
    restart: unless-stopped
    labels:
      wud.watch: "true"
      wud.watch.digest: "true"
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND:-127.0.0.1:8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5

  wud:
    image: getwud/wud:latest
    container_name: pe-na-areia-wud
    restart: unless-stopped
    labels:
      wud.watch: "false"
    depends_on:
      - frontend
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      WUD_WATCHER_LOCAL_CRON: ${WUD_WATCHER_LOCAL_CRON:-*/2 * * * *}
      WUD_WATCHER_LOCAL_WATCHBYDEFAULT: ${WUD_WATCHER_LOCAL_WATCHBYDEFAULT:-false}
      WUD_TRIGGER_DOCKER_LOCAL_AUTO: ${WUD_AUTO_UPDATE:-false}
      WUD_TRIGGER_DOCKER_LOCAL_PRUNE: ${WUD_TRIGGER_DOCKER_LOCAL_PRUNE:-true}

volumes:
  postgres_data:
  backend_uploads:
